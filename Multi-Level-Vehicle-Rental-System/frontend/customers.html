<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Manage customers in RENTX rental system.">
    <title>Customers – RENTX</title>
    <link rel="stylesheet" href="css/style.css?v=2">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <div class="brand-logo">RX</div>
        <div>
            <span class="brand-name">RENTX</span>
            <span class="brand-subtitle">Multi-Level Vehicle Rental</span>
        </div>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">🏠 Dashboard</a></li>
        <li><a href="vehicles.html">🚗 Vehicles</a></li>
        <li><a href="customers.html" class="active">👥 Customers</a></li>
        <li><a href="rental.html">🔑 Rent</a></li>
        <li><a href="return.html">↩️ Return</a></li>
        <li><a href="history.html">📋 History</a></li>
    </ul>
</nav>

<div class="page-header">
    <h1>👥 Customers</h1>
    <p>Register and manage customer records.</p>
</div>

<main class="main-content">
    <div class="two-col" style="align-items:start;">

        <!-- Customer List -->
        <div class="card fade-in" style="grid-column: 1 / -1;">
            <div class="card-header">
                <h2>Customer List</h2>
                <div style="display:flex; gap:0.75rem;">
                    <div class="search-input" style="min-width:200px;">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="customer-search" placeholder="Search by name or ID..." oninput="filterCustomers()">
                    </div>
                    <button class="btn btn-primary" onclick="openModal('add-customer-modal')">
                        ➕ Add Customer
                    </button>
                </div>
            </div>
            <div id="customer-table-wrapper">
                <div class="loading-overlay"><div class="spinner"></div> Loading customers...</div>
            </div>
        </div>

    </div>
</main>

<!-- ADD CUSTOMER MODAL -->
<div class="modal-overlay" id="add-customer-modal">
    <div class="modal">
        <div class="modal-header">
            <h3>➕ Register New Customer</h3>
            <button class="modal-close" onclick="closeModal('add-customer-modal')">✕</button>
        </div>
        <div class="modal-body">
            <form id="add-customer-form" onsubmit="submitCustomer(event)">
                <div class="two-col">
                    <div class="form-group">
                        <label class="form-label" for="c-id">Customer ID *</label>
                        <input class="form-control" id="c-id" type="text" placeholder="e.g. CUST004" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="c-name">Full Name *</label>
                        <input class="form-control" id="c-name" type="text" placeholder="e.g. John Doe" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-phone">Phone Number *</label>
                    <input class="form-control" id="c-phone" type="tel" placeholder="e.g. 9876543210" required minlength="10">
                </div>
                <div class="form-group">
                    <label class="form-label" for="c-email">Email Address</label>
                    <input class="form-control" id="c-email" type="email" placeholder="e.g. john@example.com">
                </div>
                <div class="modal-footer" style="padding:0; border:none; margin-top:0.5rem;">
                    <button type="button" class="btn btn-outline" onclick="closeModal('add-customer-modal')">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="add-customer-btn">Register Customer</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- CUSTOMER RENTALS MODAL -->
<div class="modal-overlay" id="customer-rentals-modal">
    <div class="modal" style="max-width:680px;">
        <div class="modal-header">
            <h3 id="customer-rentals-title">Customer Rentals</h3>
            <button class="modal-close" onclick="closeModal('customer-rentals-modal')">✕</button>
        </div>
        <div class="modal-body" id="customer-rentals-body">
            <div class="loading-overlay"><div class="spinner"></div></div>
        </div>
    </div>
</div>

<script src="js/app.js"></script>
<script src="js/customers.js"></script>
</body>
</html>
